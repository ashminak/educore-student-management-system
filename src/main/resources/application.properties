spring.application.name=STUDENT-MANAGEMENT-SYSTEM


server.port=8081

#########################################

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ashmina@2000}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#################################################
# JPA
#################################################

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

#################################################
# HIBERNATE
#################################################

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#################################################
# JWT
#################################################

jwt.secret=${JWT_SECRET:ThisIsDevelopmentSecretKeyForStudentManagementSystemJwt12345678901234567890}
jwt.expiration=900000
jwt.refresh-expiration=604800000
jwt.issuer=student-management-system

#################################################
# LOGGING
#################################################

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

########################################################
# FILE STORAGE
########################################################
file.upload-location=uploads
file.student-folder=students
file.teacher-folder=teachers
file.document-folder=documents
file.course-folder=course-materials
########################################################
# MULTIPART
########################################################
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB



#######################################################
# MAIL CONFIGURATION
#######################################################

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=ashminakhatun00@gmail.com

spring.mail.password=dmjsrttomnocuvto

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000

spring.mail.properties.mail.smtp.timeout=5000

spring.mail.properties.mail.smtp.writetimeout=5000


#######################################################
# EMAIL
#######################################################

mail.from=ashminakhatun00@gmail.com

mail.application-name=Student Management System



######################################################
# PDF
######################################################

pdf.application-name=Student Management System

pdf.author=Ashmina Khatun

pdf.company=Student Management System

pdf.page-size=A4

pdf.default-font=HELVETICA

pdf.default-font-size=12


####################################################
# SWAGGER
####################################################

springdoc.api-docs.enabled=true

springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.packages-to-scan=com.STUDENT_MANAGEMENT._SYSTEM

springdoc.paths-to-match=/api/**
